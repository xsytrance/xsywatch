# MERIDIAN HAYATE — Nakajima Ki-84 Hayate.
#
# Regenerate XML:  python3 tools/generate_face.py hayate
#
# DEVELOPMENT ONLY. The dial plate, the ordnance hands and the canopy scene
# are AI-generated concept art. See PROVENANCE.md.
#
# THE SIGNATURE: z10 is the motion-blurred airscrew, and it never stops.
# Every hero render in the collection has one; this is the first face to
# carry it. It is a true motion blur — the actual generated shell swept
# through a full revolution at low per-pass opacity — not an effect.
#
# WHY THAT ALSO SURVIVES THE HARDWARE: a Wear OS face is throttled hard when
# idle, so a crisply drawn propeller would strobe against the frame rate. A
# blur has no features to alias, so it reads smooth at any refresh rate.
#
# NOTHING PAINTED ALSO MOVES. The plate carries bare pivots and empty
# apertures only. Getting this wrong on HOG-WILD put two fuel needles and
# doubled text on the wearer's wrist.

[face]
slug = "hayate"
width = 480
height = 480
wff_version = 4
clock_type = "ANALOG"
preview_time = "10:09:32"
background_color = "#FF000000"

[identity]
package = "com.xsytrance.hayate.dev"
version_code = 12
version_name = "1.3.0-dev"

[[fonts]]
name = "hyt"
height = 40
[fonts.characters]
"%" = ["m_pct", 39]
"0" = ["m_0", 28]
"1" = ["m_1", 28]
"2" = ["m_2", 28]
"3" = ["m_3", 28]
"4" = ["m_4", 28]
"5" = ["m_5", 28]
"6" = ["m_6", 28]
"7" = ["m_7", 28]
"8" = ["m_8", 28]
"9" = ["m_9", 28]

# ---- scene, document order = z-order ---------------------------------

# ---- THE VIEWFINDER: a live, wrist-reactive gunsight ------------------
#
# The view through the glass rolls and pitches with the wearer's arm, the way
# MERIDIAN ATTITUDE's horizon does, AND shows the real weather.
#
# It sits FIRST in z-order on purpose. WFF has no mask primitive for a
# PartImage, so the plate above it — whose only transparent region is the
# gunsight aperture — is what crops it. Occlusion is the mask.
#
# The field sprite is 200px in a 100px hole. That margin is what the roll and
# pitch travel eat into; size it tight and the wearer sees the edge of the
# world when they tilt their arm.
#
# Roll gain is applied negated, so the horizon appears to stay level while
# the instrument turns around it — what a real gyro does.
#
# THE WEATHER NOW MOVES. Each branch carries its own overlay scrolling over
# the scene: rain and storm fall, snow drifts, cloud slides sideways, stars
# wheel. The overlays are seamlessly tiling sprites translated by exactly
# their tile period, drawn by tools/make_weather_overlays.py — arithmetic, not
# generation, so unlike everything else on this dial they are original by
# construction.
#
# No clip sprite is needed here and `aperture = true` says so: this face's
# window is a real hole through the plate and everything in the field box is
# cropped by it already.
#
# THE FIELD SPRITES WERE CARRYING A SECOND RETICLE. The scenes were generated
# with the gunsight drawn into them, so hy_fld_*.png held a red reticle that
# rolled with the wrist while the etched one on hy_sight_glass.png stayed put.
# Level, they coincided and it looked right; tilted, the sight split in two.
# tools/strip_baked_reticle.py has removed the baked copy.
[[components]]
type = "animated_weather"
name = "z00_viewfinder"
box = {x = 140, y = 272, width = 200, height = 200}
tile = 100
aperture = true
scenes = {wx_clear = "hy_fld_clear", wx_dull = "hy_fld_overcast", wx_rain = "hy_fld_rain", wx_storm = "hy_fld_rain", wx_snow = "hy_fld_snow", wx_night = "hy_fld_night"}
overlays = {wx_dull = "hy_ov_cloud", wx_rain = "hy_ov_rain", wx_storm = "hy_ov_storm", wx_snow = "hy_ov_snow", wx_night = "hy_ov_stars"}
periods = {wx_dull = 30.0, wx_rain = 1.5, wx_storm = 1.2, wx_snow = 6.0, wx_night = 45.0}
flash = "hy_ov_flash"
flash_period_s = 24.0
rain_pct = 50
showers_pct = 20
storm_pct = 75
snow_temp = 2
roll_gain_deg = 24.0
shift_y_px = 20.0
roll_clamp_deg = 45
shift_clamp_deg = 40
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "static_image"
name = "z01_plate"
resource = "hy_dial"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "static_image"
name = "z02_plate_aod"
resource = "hy_dial_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}


# The sight's own hardware: armoured rim, etched reticle, curved glass. It
# rides above the plate and never moves — a reticle that slides off the sight
# is worse than no reticle.
[[components]]
type = "static_image"
name = "z03_sight_glass"
resource = "hy_sight_glass"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.1, interpolation = "EASE_OUT"}

# ---- the signature: the airscrew never stops -------------------------

[[components]]
type = "rotating_image"
name = "z10_airscrew"
resource = "hy_disc"
box = {x = 0, y = 0, width = 480, height = 480}
speed = 300.0
ratio_note = "three-blade airscrew, 1.2s per revolution"
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# ---- instruments -----------------------------------------------------

# Fuel reserve, sweeping the painted arc at twelve.
[[components]]
