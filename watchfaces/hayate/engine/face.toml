name = "z11_reserve"
resource = "hy_reserve_needle"
box = {x = 0, y = 0, width = 480, height = 480}
start_deg = -46.0
sweep_deg = 92.0
aod = {alpha = 0, duration = 0.4, offset = 0.1}

[[components]]
type = "value_needle"
name = "z12_steps_needle"
resource = "hy_steps_needle"
box = {x = 84, y = 260, width = 108, height = 108}
start_deg = 235.0
sweep_deg = 250.0
source = "[STEP_COUNT]"
lo = 0
hi = 20000
aod = {alpha = 0, duration = 0.4, offset = 0.1}

[[components]]
type = "value_needle"
name = "z13_bpm_needle"
resource = "hy_bpm_needle"
box = {x = 288, y = 260, width = 108, height = 108}
start_deg = 235.0
sweep_deg = 250.0
source = "[HEART_RATE]"
lo = 0
hi = 200
aod = {alpha = 0, duration = 0.4, offset = 0.1}

