# MERIDIAN WARTHOG — Fairchild Republic A-10 Thunderbolt II.
#
# Artwork GENERATED by ~/AGENOR-Horology/scripts/warthog.py. Edit the studio
# script, not the exported PNGs.
#
# Regenerate XML:  python3 tools/generate_face.py warthog
#
# NOT AN ATTITUDE SQUADRON VARIANT. The squadron collection is one chassis in
# thirteen paint jobs — shared component list, shared bindings, shared horizon
# contract — which is exactly why no variant reads as a particular aeroplane.
# This face deliberately shares none of that structure. There is no propeller
# and no horizon window, because the A-10 is a twin-turbofan jet with neither.
#
# THE SIGNATURE: z30 is the GAU-8/A Avenger's seven-barrel muzzle seen
# head-on, turning once a minute. The gun IS the seconds hand. One barrel
# carries a scorched firing ring; without it, seven identical bores would be
# ambiguous under 1/7 rotational symmetry and the sweep would not read.
#
# The rule this face establishes for the collection: the aircraft's defining
# moving part drives the watch's defining motion. Reuse that rule, not this
# component list.

[face]
slug = "warthog"
width = 480
height = 480
wff_version = 4
clock_type = "ANALOG"
preview_time = "10:09:35"
background_color = "#FF000000"

[identity]
package = "com.xsytrance.warthog.dev"
version_code = 1
version_name = "0.1.0-dev"

[[fonts]]
name = "whg"
height = 40
[fonts.characters]
"%" = ["m_pct", 37]
"0" = ["m_0", 27]
"1" = ["m_1", 27]
"2" = ["m_2", 27]
"3" = ["m_3", 27]
"4" = ["m_4", 27]
"5" = ["m_5", 27]
"6" = ["m_6", 27]
"7" = ["m_7", 27]
"8" = ["m_8", 27]
"9" = ["m_9", 27]

# ---- scene, document order = z-order ---------------------------------

# The nose: gunship-grey skin, bubble canopy, tiger eyes, shark mouth.
[[components]]
type = "static_image"
name = "z00_nose"
resource = "wh_dial"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

# Ambient replaces the plate outright rather than dimming it: the ambient
# plate is drawn as strokes on black, so nothing large stays lit.
[[components]]
type = "static_image"
name = "z01_nose_aod"
resource = "wh_dial_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# Ammo gauge needle, reflected in the canopy glass. The scale is painted on
# the plate; this is the only moving part of it. Span matches the studio's
# HUD arc: 32 degrees either side of twelve.
[[components]]
type = "battery_needle"
name = "z10_ammo"
resource = "wh_ammo_needle"
box = {x = 0, y = 0, width = 480, height = 480}
start_deg = 328.0
sweep_deg = 64.0
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# ---- live data. No fabricated fallbacks: an absent or unpermitted sensor
# ---- reads 0, which is the project's established fail-safe.

# Rounds remaining in the drum, scaled from battery. The GAU-8 holds 1,174.
[[components]]
type = "text_line"
name = "z20_rounds"
box = {x = 200, y = 124, width = 80, height = 22}
font = "whg"
size = 15
color = "#7EE28A"
template = "%d"
expressions = ["[BATTERY_PERCENT] * 1174 / 100"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

[[components]]
type = "date_text"
name = "z21_date"
box = {x = 210, y = 333, width = 60, height = 32}
font = "whg"
size = 24
color = "#E2E7EC"
template = "%d"
expression = "[DAY]"
aod = {alpha = 150, duration = 0.4, offset = 0.2}

[[components]]
type = "text_line"
name = "z22_steps"
box = {x = 70, y = 228, width = 80, height = 26}
font = "whg"
size = 18
color = "#E2E7EC"
template = "%d"
expressions = ["[STEP_COUNT]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

[[components]]
type = "text_line"
name = "z23_hr"
box = {x = 330, y = 228, width = 80, height = 26}
font = "whg"
size = 18
color = "#E2E7EC"
template = "%d"
expressions = ["[HEART_RATE]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# ---- the signature: the gun turns, and that is the seconds hand -------

[[components]]
type = "seconds_rotor"
name = "z30_gun"
resource = "wh_barrels"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0}

# Ambient keeps the muzzle as a static ember at twelve. Rotating it would
# animate the display every second for no legibility gain.
[[components]]
type = "static_image"
name = "z31_gun_aod"
resource = "wh_barrels_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# ---- hands: 30mm rounds, brass case and HEI-banded projectile ---------

[[components]]
type = "analog_hand"
name = "z32_hour"
resource = "wh_hand_hour"
which = "hour"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z33_minute"
resource = "wh_hand_minute"
which = "minute"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z34_hour_aod"
resource = "wh_hand_hour_aod"
which = "hour"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

[[components]]
type = "analog_hand"
name = "z35_minute_aod"
resource = "wh_hand_minute_aod"
which = "minute"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# The pinion is the gun's rotor shaft cap, pinning the hands over the muzzle.
[[components]]
type = "static_image"
name = "z40_shaft"
resource = "wh_hub"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "static_image"
name = "z41_shaft_aod"
resource = "wh_hub_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}
