# MERIDIAN WARTHOG mk2 — Fairchild Republic A-10 Thunderbolt II.
#
# Artwork GENERATED by ~/AGENOR-Horology/scripts/warthog.py. Edit the studio
# script, not the exported PNGs.
#
# Regenerate XML:  python3 tools/generate_face.py warthog
#
# NOT AN ATTITUDE SQUADRON VARIANT. That collection is one chassis in thirteen
# paint jobs — shared component list, shared bindings, shared horizon contract
# — which is exactly why no variant reads as a particular aeroplane. This face
# shares none of that structure. There is no propeller and no horizon window,
# because the A-10 is a twin-turbofan jet with neither.
#
# THE SIGNATURE: z30 is the GAU-8/A Avenger's seven-barrel muzzle seen
# head-on, turning once a minute. The gun IS the seconds hand. One barrel
# carries a heat-glowing crown; without it, seven identical bores would be
# ambiguous under 1/7 rotational symmetry and the sweep would not read.
#
# mk2 is the fierce revision: nose-art eyes deleted, jaw rebuilt with
# irregular pitch and length, and the plate turned into a weapons console —
# radar PPI with a live sweep, a turbine gauge running on the wearer's heart
# rate, an ammunition drum on battery.
#
# TAP TO FIRE: z50 is a twelve-frame muzzle burst on WFF's only interaction
# hook, AnimationController play="TAP". It is hidden before and after, so the
# face is undisturbed until provoked.
#
# SOUND IS NOT POSSIBLE. WFF defines no audio, vibration or haptic element at
# any version through 5, and a face ships hasCode=false. See the studio script
# header and docs/WARTHOG_MK2.md.

[face]
slug = "warthog"
width = 480
height = 480
wff_version = 4
clock_type = "ANALOG"
preview_time = "10:09:35"
background_color = "#FF000000"

[identity]
package = "com.xsytrance.warthog.dev"
version_code = 2
version_name = "0.2.0-dev"

[[fonts]]
name = "whg"
height = 40
[fonts.characters]
"%" = ["m_pct", 37]
"0" = ["m_0", 27]
"1" = ["m_1", 27]
"2" = ["m_2", 27]
"3" = ["m_3", 27]
"4" = ["m_4", 27]
"5" = ["m_5", 27]
"6" = ["m_6", 27]
"7" = ["m_7", 27]
"8" = ["m_8", 27]
"9" = ["m_9", 27]

# ---- scene, document order = z-order ---------------------------------

# Armour plate: tread texture, panel seams, hazard chevrons at the muzzle,
# radar scope, gauge faces, jaw, stencilled legends.
[[components]]
type = "static_image"
name = "z00_plate"
resource = "wh_dial"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

# Ambient replaces the plate outright rather than dimming it: the ambient
# plate is strokes on black, so nothing large stays lit.
[[components]]
type = "static_image"
name = "z01_plate_aod"
resource = "wh_dial_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# Radar sweep. Its own 108px sprite so the pivot lands on the scope centre
# rather than the dial centre. 90 deg/s = one sweep every four seconds.
[[components]]
type = "rotating_image"
name = "z10_sweep"
resource = "wh_radar_sweep"
box = {x = 186, y = 46, width = 108, height = 108}
speed = 90.0
ratio_note = "PPI sweep, 4s per revolution"
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# Turbine gauge needle, oscillating at the wearer's own heart rate. Centred
# on mid-scale; an absent or unpermitted sensor falls back to 70 bpm.
[[components]]
type = "hr_balance"
name = "z11_turbine"
resource = "wh_rpm_needle"
box = {x = 60, y = 188, width = 96, height = 96}
center = 0
amplitude = 34
fallback = 70
clamp_lo = 40
clamp_hi = 200
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# Ammunition drum needle: rounds remaining, driven by battery over the
# gauge's 250 degrees of travel.
[[components]]
type = "battery_needle"
name = "z12_drum"
resource = "wh_ammo_needle"
box = {x = 324, y = 188, width = 96, height = 96}
start_deg = 235.0
sweep_deg = 250.0
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# ---- live data. No fabricated fallbacks: an absent or unpermitted sensor
# ---- reads 0, which is the project's established fail-safe.

[[components]]
type = "text_line"
name = "z20_steps"
box = {x = 113, y = 301, width = 74, height = 24}
font = "whg"
size = 16
color = "#E0E6EC"
template = "%d"
expressions = ["[STEP_COUNT]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

[[components]]
type = "date_text"
name = "z21_date"
box = {x = 299, y = 300, width = 62, height = 26}
font = "whg"
size = 18
color = "#E0E6EC"
template = "%d"
expression = "[DAY]"
aod = {alpha = 150, duration = 0.4, offset = 0.2}

[[components]]
type = "text_line"
name = "z22_bpm"
box = {x = 68, y = 245, width = 80, height = 22}
font = "whg"
size = 15
color = "#FFB23E"
template = "%d"
expressions = ["[HEART_RATE]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# Rounds remaining, scaled from battery. The GAU-8 drum holds 1,174.
[[components]]
type = "text_line"
name = "z23_rounds"
box = {x = 332, y = 245, width = 80, height = 22}
font = "whg"
size = 15
color = "#56FA8C"
template = "%d"
expressions = ["[BATTERY_PERCENT] * 1174 / 100"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# ---- the signature: the gun turns, and that is the seconds hand -------

[[components]]
type = "seconds_rotor"
name = "z30_gun"
resource = "wh_gun"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0}

# Ambient keeps the muzzle as a static ember at twelve. Rotating it would
# animate the display every second for no legibility gain.
[[components]]
type = "static_image"
name = "z31_gun_aod"
resource = "wh_gun_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# ---- hands: 30mm rounds, brass case and a threat-red HEI band ---------

[[components]]
type = "analog_hand"
name = "z32_hour"
resource = "wh_hand_hour"
which = "hour"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z33_minute"
resource = "wh_hand_minute"
which = "minute"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z34_hour_aod"
resource = "wh_hand_hour_aod"
which = "hour"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

[[components]]
type = "analog_hand"
name = "z35_minute_aod"
resource = "wh_hand_minute_aod"
which = "minute"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# The pinion is the gun's rotor shaft cap, pinning the hands over the muzzle.
[[components]]
type = "static_image"
name = "z40_shaft"
resource = "wh_hub"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "static_image"
name = "z41_shaft_aod"
resource = "wh_hub_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# ---- BRRRT: the tap payload ------------------------------------------
#
# WFF's only interaction hook. The box is the whole canvas, because the
# format has no pointer position and no per-region hit testing — a tap
# anywhere fires the gun. Hidden before and after so nothing is left behind,
# and suppressed entirely in ambient.
[[components]]
type = "tap_sequence"
name = "z50_brrrt"
box = {x = 0, y = 0, width = 480, height = 480}
frame_rate = 24
loop_count = 1
before = "HIDE"
after = "HIDE"
resources = [
  "wh_flash_00", "wh_flash_01", "wh_flash_02", "wh_flash_03",
  "wh_flash_04", "wh_flash_05", "wh_flash_06", "wh_flash_07",
  "wh_flash_08", "wh_flash_09", "wh_flash_10", "wh_flash_11",
]
aod = {alpha = 0, duration = 0.4, offset = 0.0}
