# AURELIUS visual contract — fixed render states (ADR-009, Phase 3).
#
# Every state pins ALL dynamic inputs the face's expressions can read, so
# reference renders are deterministic and repeatable byte-for-byte.
#
# Render:   python3 tools/render_reference.py aurelius --state normal_hero
# Compare:  python3 tools/compare_visuals.py <a.png> <b.png> [--mask m.png]
#
# Determinism rules (enforced by tools/render_reference.py):
#   - ambient = true forces second = 0 and millisecond = 0, matching observed
#     Watch7 behavior (sub-minute sources stop updating in ambient; the
#     seconds cage parks at 12 — see Phase-2 device evidence).
#   - Angles are WFF clockwise degrees; the renderer negates for Pillow.
#   - All expression evaluation is double-precision IEEE 754 via Python math.

[meta]
face = "aurelius"
contract_version = 1
# The reference renderer consumes the COMMITTED generated XML
# (app/src/main/res/raw/watchface.xml) plus the committed res/ bytes.
# face.toml -> XML equivalence is separately gated by
# `python3 tools/generate_face.py aurelius --check`; this contract closes
# the remaining XML -> pixels gap.

[render]
# Development-dependency pin (recorded in golden metadata; the renderer
# fails --strict runs on mismatch so goldens never silently change origin).
pillow_version = "12.1.1"
resample_rotate = "bicubic"
resample_scale = "lanczos"

# ---------------------------------------------------------------------------
# States. Unspecified keys are inherited from [states.normal_hero].
# ---------------------------------------------------------------------------

[states.normal_hero]
# Canonical hero: the face's own PREVIEW_TIME (10:09:35), the evidence date.
hour_0_11 = 10
minute = 9
second = 35
millisecond = 0
day = 24
battery_percent = 80
heart_rate = 72          # valid live reading (> 30, inside clamp range)
accelerometer_angle_x = 0
accelerometer_angle_y = 0
ambient = false

[states.aod]
inherit = "normal_hero"
ambient = true           # forces second = 0, millisecond = 0

[states.low_battery]
inherit = "normal_hero"
battery_percent = 15

[states.high_battery]
inherit = "normal_hero"
battery_percent = 95

[states.hr_valid]
inherit = "normal_hero"
heart_rate = 150

[states.hr_fallback]
inherit = "normal_hero"
heart_rate = 0           # < 30 triggers the 70 bpm safe fallback path

[states.parallax_neutral]
# Explicit neutral-tilt state: parallax expressions must evaluate to their
# base offsets. Identical to the hero pins by construction; kept as a named
# state so parallax regressions have a dedicated fixture hook.
inherit = "normal_hero"
accelerometer_angle_x = 0
accelerometer_angle_y = 0

# ---------------------------------------------------------------------------
# Goldens: which states define the approved references.
# ---------------------------------------------------------------------------

[goldens]
normal_state = "normal_hero"
aod_state = "aod"
approved_version = "field-tourbillon-v1"

# ---------------------------------------------------------------------------
# Comparison policy.
# ---------------------------------------------------------------------------

[compare]
# Reference-render reruns are fully deterministic: exact equality required.
reference_mode = "exact"

# Device screenshots include panel/pipeline variation: perceptual profile,
# calibrated from Phase-2 device evidence (screencap vs reference deltas).
# A WARBIRD-style substitution changes >30% of face pixels at large deltas;
# these thresholds sit two orders of magnitude below that.
[compare.device_profile]
max_changed_pixel_pct = 1.5
max_mean_channel_delta = 3.0
max_channel_delta = 48

[compare.mask_policy]
# Masks may exclude legitimately dynamic/non-capturable regions only.
# Coverage = unmasked fraction of the 480x480 face disc (r=240).
min_disc_coverage = 0.60
