# MERIDIAN COMMODORE — ATTITUDE SQUADRON.
#
# GENERATED by tools/squadron_scaffold.py from the studio collection
# manifest. Edit the studio platform, not this file.
#
# Regenerate XML:  python3 tools/generate_face.py squadron-commodore
#
# The most sellable. Deep navy sunburst, warm gold furniture, polished indices — the one that photographs best.
#
# The whole collection shares this component list, these data bindings and
# this horizon motion contract. A variant differs only in artwork.
#
# Motion profiles: damped 14/14, proposed 22/26, assertive 30/34, roll-only,
# static. PROPOSED is the provisional default; changing it means editing
# the two gains in z00_horizon and regenerating. No artwork changes.

[face]
slug = "squadron-commodore"
width = 480
height = 480
wff_version = 4
clock_type = "ANALOG"
preview_time = "10:09:35"
background_color = "#FF000000"

[identity]
package = "com.xsytrance.squadron.commodore.dev"
version_code = 1
version_name = "0.1.0-dev"

[[fonts]]
name = "sqd"
height = 40
[fonts.characters]
"%" = ["m_pct", 37]
"0" = ["m_0", 27]
"1" = ["m_1", 27]
"2" = ["m_2", 27]
"3" = ["m_3", 27]
"4" = ["m_4", 27]
"5" = ["m_5", 27]
"6" = ["m_6", 27]
"7" = ["m_7", 27]
"8" = ["m_8", 27]
"9" = ["m_9", 27]

# ---- scene, document order = z-order ---------------------------------

[[components]]
type = "horizon_field"
name = "z00_horizon"
resource = "sq_horizon"
box = {x = 114, y = 204, width = 252, height = 252}
roll_gain_deg = 22.0
pitch_gain_px = 26.0
roll_clamp_deg = 45
pitch_clamp_deg = 40
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

# AOD neutrality is structural: the moving field is hidden and this frozen
# one replaces it, so nothing visible in ambient carries a sensor transform.
[[components]]
type = "static_image"
name = "z01_horizon_aod"
resource = "sq_horizon_aod"
box = {x = 114, y = 204, width = 252, height = 252}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# Opaque everywhere but the aperture — this is what occludes the field.
[[components]]
type = "static_image"
name = "z02_plate"
resource = "sq_dial"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "static_image"
name = "z03_plate_aod"
resource = "sq_dial_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

[[components]]
type = "battery_needle"
name = "z10_resv"
resource = "sq_battery_needle"
box = {x = 0, y = 0, width = 480, height = 480}
start_deg = 298.0
sweep_deg = 124.0
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# ---- live data. No fabricated fallbacks: an absent or unpermitted sensor
# ---- reads 0, which is the project's established fail-safe.

[[components]]
type = "text_line"
name = "z20_batt"
box = {x = 200, y = 92, width = 80, height = 28}
font = "sqd"
size = 18
color = "#E2E7EC"
template = "%d%%"
expressions = ["[BATTERY_PERCENT]"]
align = "CENTER"
aod = {alpha = 120, duration = 0.4, offset = 0.2}

[[components]]
type = "date_text"
name = "z21_date"
box = {x = 318, y = 222, width = 60, height = 34}
font = "sqd"
size = 24
color = "#E2E7EC"
template = "%d"
expression = "[DAY]"
aod = {alpha = 140, duration = 0.4, offset = 0.2}

[[components]]
type = "text_line"
name = "z22_steps"
box = {x = 72, y = 294, width = 80, height = 28}
font = "sqd"
size = 18
color = "#E2E7EC"
template = "%d"
expressions = ["[STEP_COUNT]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

[[components]]
type = "text_line"
name = "z23_hr"
box = {x = 328, y = 294, width = 80, height = 28}
font = "sqd"
size = 18
color = "#E2E7EC"
template = "%d"
expressions = ["[HEART_RATE]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# ---- the signature: sculpted propeller-blade hands --------------------

[[components]]
type = "analog_hand"
name = "z30_hour"
resource = "sq_hand_hour"
which = "hour"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z31_minute"
resource = "sq_hand_minute"
which = "minute"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "seconds_rotor"
name = "z32_second"
resource = "sq_hand_second"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0}

[[components]]
type = "analog_hand"
name = "z34_hour_aod"
resource = "sq_hand_hour_aod"
which = "hour"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

[[components]]
type = "analog_hand"
name = "z35_minute_aod"
resource = "sq_hand_minute_aod"
which = "minute"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

