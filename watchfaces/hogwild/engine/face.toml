# MERIDIAN HOG-WILD — A-10 Thunderbolt II "Warthog".
#
# Regenerate XML:  python3 tools/generate_face.py hogwild
#
# DEVELOPMENT ONLY. The dial plate is AI-generated concept art, produced via
# Flux Kontext Pro from a procedurally-placed layout. It is deliberately NOT
# committed. This package exists to get the design onto a wrist for judgement;
# anything that ships is rebuilt as original construction per
# docs/reports/AIRCRAFT_WATCH_DISCOVERY.md.
#
# THE SPLIT. The concept image had hands and needles painted into it. A watch
# face cannot: they move. So the plate is regenerated hands-free and the
# moving parts are separate layers composited over it — the hands, the fuel
# needle on battery, the RPM needle on heart rate, and the radar sweep.
#
# Sub-dial anchors are the 1024-canvas layout coordinates scaled by 480/1024,
# which is why the sprite boxes look arbitrary: each one is sized to its own
# gauge so WFF pivots about that gauge's centre, not the dial centre.

[face]
slug = "hogwild"
width = 480
height = 480
wff_version = 4
clock_type = "ANALOG"
preview_time = "10:09:32"
background_color = "#FF000000"

[identity]
package = "com.xsytrance.hogwild.dev"
version_code = 10
version_name = "1.3.3-dev"

[[fonts]]
name = "hwg"
height = 40
[fonts.characters]
":" = ["m_colon", 18]
"%" = ["m_pct", 39]
"0" = ["m_0", 28]
"1" = ["m_1", 28]
"2" = ["m_2", 28]
"3" = ["m_3", 28]
"4" = ["m_4", 28]
"5" = ["m_5", 28]
"6" = ["m_6", 28]
"7" = ["m_7", 28]
"8" = ["m_8", 28]
"9" = ["m_9", 28]

# Combination-lock wheel digits (tools/make_wheel_font.py): each glyph is a
# full wheel cell — knurled flanks, cylindrically-lit drum face, engraved
# numeral — so flush cells compose into a wheel bank. Bitmap fonts are
# ALPHA MASKS (the pipeline discards glyph colour and fills with the
# BitmapFont colour), so the wheel ships as relief in the alpha channel
# and the component's colour is the steel.
[[fonts]]
name = "wheel"
height = 46
[fonts.characters]
"0" = ["w_0", 34]
"1" = ["w_1", 34]
"2" = ["w_2", 34]
"3" = ["w_3", 34]
"4" = ["w_4", 34]
"5" = ["w_5", 34]
"6" = ["w_6", 34]
"7" = ["w_7", 34]
"8" = ["w_8", 34]
"9" = ["w_9", 34]

# ---- scene, document order = z-order ---------------------------------

[[components]]
type = "static_image"
name = "z00_plate"
resource = "wh_dial"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

# Ambient drops the plate for an outline-and-lume version: a photoreal dial
# is the worst case for burn-in and power.
[[components]]
type = "static_image"
name = "z01_plate_aod"
resource = "wh_dial_aod"
box = {x = 0, y = 0, width = 480, height = 480}
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

# ---- WEATHER, AS A RADAR ACTUALLY SHOWS IT ---------------------------
#
# Every other face in the collection reads its weather out of a window. This
# one has no window, and giving it one would be giving it somebody else's
# dial. What it has is a PPI scope, and showing where the precipitation is
# happens to be exactly what a scope is for — so the returns are not a
# substitute for a weather display, they are the weather display.
#
# The returns are drawn by tools/make_weather_overlays.py: cellular echoes,
# brighter at the core, clipped to the glass, seeded so they are stable. Green
# when it is merely wet, amber cores when it is heavy — the way a scope
# colours rain rate. Original by construction, unlike this face's plate.
#
# They hold station and breathe on alpha rather than scrolling. Echoes that
# slid across a scope would be reading out ground speed, and this aircraft is
# not supplying any. The sweep below already provides the motion, and it now
# passes over something.
#
# Dry weather paints nothing at all. A blank scope is the correct reading for
# clear air, and it is also the only one the format allows: a Compare element
# must have at least one child, so the dry branches are simply not declared
# and the Condition falls through to nothing.
[[components]]
type = "radar_weather"
name = "z09_returns"
box = {x = 184, y = 305, width = 113, height = 113}
light = "wh_rdr_light"
heavy = "wh_rdr_heavy"
rain_pct = 50
showers_pct = 20
storm_pct = 75
snow_temp = 2
breathe_period_s = 6.0
roll_gain_deg = 5.0
shift_x_px = 4.0
shift_y_px = 6.0
roll_clamp_deg = 45
shift_clamp_deg = 40
aod = {alpha = 0, duration = 0.4, offset = 0.1, interpolation = "EASE_OUT"}

# Radar sweep, on its own sprite so the pivot lands on the scope centre.
# 4 s per revolution. It now sweeps over live returns rather than empty glass.
[[components]]
type = "rotating_image"
name = "z10_sweep"
resource = "wh_sweep"
box = {x = 184, y = 305, width = 113, height = 113}
speed = 90.0
ratio_note = "PPI sweep, 4s per revolution"
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# Fuel gauge needle = battery. E through F over the gauge's 250 degrees.
[[components]]
type = "battery_needle"
name = "z11_fuel"
resource = "wh_fuel_needle"
box = {x = 296, y = 99, width = 104, height = 104}
start_deg = 235.0
sweep_deg = 250.0
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# RPM needle oscillating on the wearer's own heart rate.
[[components]]
type = "hr_balance"
name = "z12_rpm"
resource = "wh_rpm_needle"
box = {x = 298, y = 278, width = 100, height = 100}
center = 0
amplitude = 32
fallback = 70
clamp_lo = 40
clamp_hi = 200
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# Steps needle. The plate now carries only bare pivots, so every needle on
# this dial is real: nothing is painted that also moves.
[[components]]
type = "value_needle"
name = "z13_steps_needle"
resource = "wh_steps_needle"
box = {x = 98, y = 289, width = 94, height = 94}
start_deg = 235.0
sweep_deg = 250.0
source = "[STEP_COUNT]"
lo = 0
hi = 20000
aod = {alpha = 0, duration = 0.4, offset = 0.1}

# ---- live data over the painted instruments --------------------------

# Heart rate in the three-o'clock aperture. This window used to repeat the
# time in digits, which an analog dial already states twice with its hands;
# the wearer's pulse was meanwhile only implied by the RPM needle's shiver.
# Now the needle carries the rhythm and the wheels carry the number. Below
# 30 the sensor is reporting an absent wrist, not a heartbeat, so the
# readout shows 0 rather than dressing a non-reading up as one.
#
# Wheel digits, not phosphor: a screen is a widget, a drum is an
# instrument. In ambient the metal goes dark with the plate and the lume
# twin below takes over — photoreal steel has no business glowing at 3am.
[[components]]
type = "text_line"
name = "z20_lcd"
box = {x = 320, y = 227, width = 80, height = 28}
font = "wheel"
size = 24
color = "#E8EAEE"
template = "%d"
expressions = ["([HEART_RATE] < 30 ? 0 : [HEART_RATE])"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# The lume twin: invisible in normal mode, carries the pulse into AOD.
[[components]]
type = "text_line"
name = "z20_lcd_aod"
box = {x = 320, y = 229, width = 80, height = 24}
font = "hwg"
size = 20
color = "#A8F0A0"
template = "%d"
expressions = ["([HEART_RATE] < 30 ? 0 : [HEART_RATE])"]
align = "CENTER"
alpha = 0
aod = {alpha = 120, duration = 0.4, offset = 0.2}

# Step total, full size, in the nine-o'clock aperture. The sub-dial was
# concept furniture — a painted needle bound to nothing — and the step
# total was 16px of squint in the odometer barrel. The readability pass
# (tools/hogwild_readability.py) gave the sub-dial a real LCD aperture;
# five digits at size 20 is the reading the barrel never had room for.
[[components]]
type = "text_line"
name = "z21_steps"
box = {x = 82, y = 234, width = 80, height = 28}
font = "wheel"
size = 20
color = "#E8EAEE"
template = "%d"
expressions = ["[STEP_COUNT]"]
align = "CENTER"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# Day of month in the old odometer barrel — two digits is exactly what
# that window has room for, and a segmented wheel window is how a date
# has been worn since 1945 anyway.
[[components]]
type = "date_text"
name = "z22_date"
box = {x = 98, y = 328, width = 70, height = 24}
font = "wheel"
size = 18
color = "#E8EAEE"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# Chance of precipitation, printed on the scope glass under the sweep.
# The returns say where the weather is; this says how likely. Gated on
# availability: an ungated readout renders a missing provider as "0%",
# which is a forecast nobody made. 0% from a live provider stays visible
# — a scope legend reading clear air is a reading, not an absence.
[[components]]
type = "text_line"
name = "z23_precip"
box = {x = 200, y = 384, width = 81, height = 16}
font = "hwg"
size = 14
color = "#7ECF8E"
template = "%d%%"
expressions = ["clamp([WEATHER.CHANCE_OF_PRECIPITATION], 0, 100)"]
align = "CENTER"
gate = "[WEATHER.IS_AVAILABLE]"
aod = {alpha = 0, duration = 0.4, offset = 0.2}

# ---- hands -----------------------------------------------------------

[[components]]
type = "analog_hand"
name = "z30_hour"
resource = "wh_hour"
which = "hour"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z31_minute"
resource = "wh_minute"
which = "minute"
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "seconds_rotor"
name = "z32_second"
resource = "wh_second"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0}

[[components]]
type = "analog_hand"
name = "z33_hour_aod"
resource = "wh_hour_aod"
which = "hour"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

[[components]]
type = "analog_hand"
name = "z34_minute_aod"
resource = "wh_minute_aod"
which = "minute"
alpha = 0
aod = {alpha = 255, duration = 0.4, offset = 0.0, interpolation = "EASE_IN"}

[[components]]
type = "static_image"
name = "z40_hub"
resource = "wh_hub"
box = {x = 0, y = 0, width = 480, height = 480}
aod = {alpha = 0, duration = 0.4, offset = 0.0, interpolation = "EASE_OUT"}
