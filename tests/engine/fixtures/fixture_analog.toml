# Engine generality fixture 1 — minimal ANALOG face.
# Proves: hand stack, AOD profiles, battery indicator, rotating mechanical
# component — with NO Aurelius resources, naming, or art (resource names are
# synthetic; no image files exist or are needed).

[face]
slug = "fixture-analog"
width = 480
height = 480
wff_version = 4
clock_type = "ANALOG"
preview_time = "10:09:35"
background_color = "#FF101010"

[identity]
package = "com.example.fixture.analog"
version_code = 1
version_name = "0.0.1"

[[components]]
type = "background_pair"
normal = "fx_plate"
aod_resource = "fx_plate_dark"
fade = 0.5

[[components]]
type = "rotating_image"
name = "z10_flywheel"
resource = "fx_flywheel"
box = {x = 60, y = 180, width = 100, height = 100}
speed = 12
aod = {alpha = 60, duration = 0.4, offset = 0.1}
ratio_note = "standalone demo wheel"

[[components]]
type = "battery_needle"
name = "z30_fuel"
resource = "fx_needle"
start_deg = 240.0
sweep_deg = 60.0
aod = {alpha = 110, duration = 0.4, offset = 0.2}

[[components]]
type = "analog_hand"
name = "z50_hh"
resource = "fx_hand_hour"
which = "hour"
aod = {alpha = 200, duration = 0.5, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "analog_hand"
name = "z51_mh"
resource = "fx_hand_minute"
which = "minute"
aod = {alpha = 200, duration = 0.5, offset = 0.0, interpolation = "EASE_OUT"}

[[components]]
type = "static_image"
name = "z52_cap"
resource = "fx_cap"
box = {x = 230, y = 230, width = 20, height = 20}
aod = {alpha = 200, duration = 0.4, offset = 0.0}
